name: Corusco CI

on:
  push:
    branches:
      - main
      - 'feature/**'
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Test and build
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Check out source
        uses: actions/checkout@v7
      - name: Set up JDK 25
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '25'
      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v6
      - name: Run tests
        run: ./gradlew test --quiet --stacktrace
      - name: Build all modules
        run: ./gradlew build --quiet --stacktrace

  gui-tests:
    name: GUI tests (Xvfb)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Check out source
        uses: actions/checkout@v7
      - name: Set up JDK 25
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '25'
      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v6
      - name: Install Xvfb
        run: command -v xvfb-run || (sudo apt-get update && sudo apt-get install -y xvfb)
      - name: Run Swing tests on a virtual display
        run: xvfb-run --auto-servernum --server-args='-screen 0 1280x1024x24' ./gradlew :corusco-swing:test -PtestHeadless=false --quiet --stacktrace
      - name: Require GUI-only tests to run
        run: |
          report=corusco-swing/build/test-results/test/TEST-cz.auderis.corusco.swing.dialog.FormDialogShellTest.xml
          test -f "$report"
          grep -q 'skipped="0"' "$report" || { echo "FormDialogShellTest was skipped"; exit 1; }

  release-readiness:
    name: Release readiness
    if: github.event_name == 'workflow_dispatch' || github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Check out source
        uses: actions/checkout@v7
      - name: Set up JDK 25
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '25'
      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v6
      - name: Verify release readiness
        run: ./gradlew verifyReleaseReadiness --quiet --stacktrace
