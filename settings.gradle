pluginManagement {
    repositories {
        gradlePluginPortal()
        mavenCentral()
    }
}

dependencyResolutionManagement {
    repositoriesMode.set(RepositoriesMode.FAIL_ON_PROJECT_REPOS)
    repositories {
        mavenCentral()
        // Corusco's own artifacts (binary-compatibility baselines and the
        // published-artifact example check) come from Maven local first and
        // then from Maven Central, never from other repositories.
        exclusiveContent {
            forRepositories(
                    mavenLocal(),
                    maven {
                        name = 'MavenCentralCorusco'
                        url = uri('https://repo.maven.apache.org/maven2/')
                    }
            )
            filter {
                includeGroup 'cz.auderis.corusco'
            }
        }
    }
}

rootProject.name = 'corusco'

include 'corusco-core'
include 'corusco-glazedlists'
include 'corusco-swing'
include 'corusco-annotations'
include 'corusco-processor'
include 'corusco-test'
include 'corusco-examples'
include 'corusco-manual'